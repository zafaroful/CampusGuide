<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Light background -->
  <rect width="1200" height="800" fill="#F5F5F5"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">
	Academic Block A - Ground Floor
  </text>

  <!-- Main grid lines for rooms -->
  <line x1="100" y1="100" x2="100" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="500" y1="100" x2="500" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="700" y1="100" x2="700" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="900" y1="100" x2="900" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="1100" y1="100" x2="1100" y2="700" stroke="#CCCCCC" stroke-width="2"/>

  <line x1="100" y1="100" x2="1100" y2="100" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="700" x2="1100" y2="700" stroke="#CCCCCC" stroke-width="2"/>

  <!-- Reception Area - larger -->
  <rect x="110" y="110" width="380" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="3"/>
  <text x="300" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Main Reception</text>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#666666">Entrance Hall</text>

  <!-- Information Desk -->
  <rect x="510" y="110" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#333333">Info Desk</text>

  <!-- Security -->
  <rect x="710" y="110" width="180" height="130" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
  <text x="800" y="180" text-anchor="middle" font-size="12" fill="#333333">Security</text>

  <!-- Waiting Area -->
  <rect x="910" y="110" width="180" height="130" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="1000" y="180" text-anchor="middle" font-size="12" fill="#333333">Waiting Area</text>

  <!-- Café -->
  <rect x="110" y="260" width="180" height="130" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#333333">Café</text>

  <!-- Dining Area -->
  <rect x="310" y="260" width="180" height="130" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#333333">Dining</text>

  <!-- Library - Circulation -->
  <rect x="510" y="260" width="180" height="130" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#333333">Library Main</text>

  <!-- Restrooms -->
  <rect x="710" y="260" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="800" y="330" text-anchor="middle" font-size="12" fill="#333333">Restrooms</text>

  <!-- Stairwell -->
  <rect x="910" y="260" width="180" height="130" fill="#ECEFF1" stroke="#78909C" stroke-width="2"/>
  <text x="1000" y="330" text-anchor="middle" font-size="12" fill="#333333">Stairs & Lift</text>

  <!-- Auditorium -->
  <rect x="110" y="410" width="380" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3"/>
  <text x="300" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Main Auditorium</text>
  <text x="300" y="475" text-anchor="middle" font-size="11" fill="#666666">500 capacity</text>

  <!-- Conference Room A -->
  <rect x="510" y="410" width="180" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="600" y="480" text-anchor="middle" font-size="12" fill="#333333">Conf Room A</text>

  <!-- Conference Room B -->
  <rect x="710" y="410" width="180" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="800" y="480" text-anchor="middle" font-size="12" fill="#333333">Conf Room B</text>

  <!-- Corridor & Storage -->
  <rect x="910" y="410" width="180" height="130" fill="#ECEFF1" stroke="#78909C" stroke-width="2"/>
  <text x="1000" y="480" text-anchor="middle" font-size="12" fill="#333333">Storage</text>

  <!-- Gymnasium -->
  <rect x="110" y="560" width="380" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3"/>
  <text x="300" y="605" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Gymnasium</text>
  <text x="300" y="625" text-anchor="middle" font-size="11" fill="#666666">Sports Complex</text>

  <!-- Locker Rooms -->
  <rect x="510" y="560" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="600" y="630" text-anchor="middle" font-size="12" fill="#333333">Lockers</text>

  <!-- First Aid -->
  <rect x="710" y="560" width="180" height="130" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
  <text x="800" y="630" text-anchor="middle" font-size="12" fill="#333333">First Aid</text>

  <!-- Back Exit -->
  <rect x="910" y="560" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="1000" y="630" text-anchor="middle" font-size="12" fill="#333333">Back Exit</text>

  <!-- Legend -->
  <text x="120" y="760" font-size="12" font-weight="bold" fill="#333333">Legend:</text>
  <rect x="300" y="745" width="15" height="15" fill="#E0F2F1" stroke="#009688" stroke-width="1"/>
  <text x="325" y="757" font-size="11" fill="#333333">Public Area</text>

  <rect x="500" y="745" width="15" height="15" fill="#FCE4EC" stroke="#E91E63" stroke-width="1"/>
  <text x="525" y="757" font-size="11" fill="#333333">Dining</text>

  <rect x="700" y="745" width="15" height="15" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="725" y="757" font-size="11" fill="#333333">Activity</text>

  <rect x="900" y="745" width="15" height="15" fill="#FFEBEE" stroke="#F44336" stroke-width="1"/>
  <text x="925" y="757" font-size="11" fill="#333333">Emergency</text>
</svg>
