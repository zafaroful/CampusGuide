<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Light background -->
  <rect width="1200" height="800" fill="#F5F5F5"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">
	Academic Block A - Floor 1
  </text>

  <!-- Main grid lines for rooms -->
  <line x1="100" y1="100" x2="100" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="500" y1="100" x2="500" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="700" y1="100" x2="700" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="900" y1="100" x2="900" y2="700" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="1100" y1="100" x2="1100" y2="700" stroke="#CCCCCC" stroke-width="2"/>

  <line x1="100" y1="100" x2="1100" y2="100" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#CCCCCC" stroke-width="2"/>
  <line x1="100" y1="700" x2="1100" y2="700" stroke="#CCCCCC" stroke-width="2"/>

  <!-- Room labels -->
  <rect x="110" y="110" width="180" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#333333">Classroom A</text>

  <rect x="310" y="110" width="180" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="#333333">Classroom B</text>

  <rect x="510" y="110" width="180" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#333333">Lab A</text>

  <rect x="710" y="110" width="180" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="800" y="180" text-anchor="middle" font-size="12" fill="#333333">Lab B</text>

  <rect x="910" y="110" width="180" height="130" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="1000" y="180" text-anchor="middle" font-size="12" fill="#333333">Office</text>

  <!-- Second row -->
  <rect x="110" y="260" width="180" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#333333">Classroom C</text>

  <rect x="310" y="260" width="180" height="130" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#333333">Library</text>

  <rect x="510" y="260" width="180" height="130" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#333333">Café</text>

  <rect x="710" y="260" width="180" height="130" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="800" y="330" text-anchor="middle" font-size="12" fill="#333333">Study Area</text>

  <rect x="910" y="260" width="180" height="130" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="1000" y="330" text-anchor="middle" font-size="12" fill="#333333">Office</text>

  <!-- Third row -->
  <rect x="110" y="410" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="200" y="480" text-anchor="middle" font-size="12" fill="#333333">Rest Area</text>

  <rect x="310" y="410" width="180" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#333333">Auditorium</text>

  <rect x="510" y="410" width="180" height="130" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="600" y="480" text-anchor="middle" font-size="12" fill="#333333">Entrance</text>

  <rect x="710" y="410" width="180" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="800" y="480" text-anchor="middle" font-size="12" fill="#333333">Restrooms</text>

  <rect x="910" y="410" width="180" height="130" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="1000" y="480" text-anchor="middle" font-size="12" fill="#333333">Storage</text>

  <!-- Legend -->
  <text x="120" y="760" font-size="12" font-weight="bold" fill="#333333">Legend:</text>
  <rect x="300" y="745" width="15" height="15" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="325" y="757" font-size="11" fill="#333333">Classroom</text>

  <rect x="520" y="745" width="15" height="15" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="545" y="757" font-size="11" fill="#333333">Lab</text>

  <rect x="700" y="745" width="15" height="15" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="725" y="757" font-size="11" fill="#333333">Common Area</text>

  <rect x="950" y="745" width="15" height="15" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="975" y="757" font-size="11" fill="#333333">Admin</text>
</svg>
